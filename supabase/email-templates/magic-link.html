<!--
  Blurr — Magic link
  Supabase Dashboard → Authentication → Email Templates → Magic Link
  Paste this whole file into the "Message body" field.
  Available variables: {{ .ConfirmationURL }} {{ .Email }} {{ .Token }} {{ .SiteURL }}
-->
<div style="background:#F4F3F0;padding:40px 16px;font-family:'Inter Tight',Helvetica,Arial,sans-serif;">
  <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="max-width:420px;margin:0 auto;background:#FFFFFF;border-radius:10px;overflow:hidden;border:1px solid rgba(10,10,10,.08);">
    <tr>
      <td style="padding:36px 32px 28px;text-align:center;">
        <div style="font-size:26px;font-weight:800;letter-spacing:-.05em;color:#0A0A0A;margin-bottom:22px;">Blurr</div>
        <div style="display:inline-block;font-family:'JetBrains Mono',Consolas,monospace;font-size:10px;letter-spacing:.24em;text-transform:uppercase;color:#94918B;border:1px solid rgba(10,10,10,.11);border-radius:999px;padding:7px 15px;margin-bottom:22px;">
          Your sign-in link
        </div>
        <h1 style="font-size:26px;font-weight:800;letter-spacing:-.045em;line-height:1.15;color:#0A0A0A;margin:0 0 14px;">
          Straight back to the shelf.
        </h1>
        <p style="font-size:14.5px;line-height:1.6;color:#55534F;margin:0 0 28px;">
          Tap below to sign in to Blurr as <span style="color:#0A0A0A;font-weight:600;">{{ .Email }}</span>.
          This link only works once.
        </p>
        <a href="{{ .ConfirmationURL }}"
           style="display:inline-block;background:#0A0A0A;color:#F4F3F0;font-size:14px;font-weight:600;letter-spacing:-.01em;padding:14px 30px;border-radius:4px;text-decoration:none;">
          Sign in to Blurr
        </a>
        <p style="font-family:'JetBrains Mono',Consolas,monospace;font-size:10px;letter-spacing:.07em;color:#94918B;margin:26px 0 0;line-height:1.6;">
          Didn't request this? Ignore this email — nobody gets in without it.
        </p>
      </td>
    </tr>
    <tr>
      <td style="padding:18px 32px;border-top:1px solid rgba(10,10,10,.06);text-align:center;">
        <p style="font-family:'JetBrains Mono',Consolas,monospace;font-size:9.5px;letter-spacing:.1em;text-transform:uppercase;color:#94918B;margin:0;">
          Blurr — preserving those fuzzy moments
        </p>
      </td>
    </tr>
  </table>
</div>
